global:
  scrape_interval: 1s
  scrape_timeout: 900ms
  evaluation_interval: 10s
  external_labels:
    environment: local
    project: fraud-monitoring

scrape_configs:
  - job_name: fraud_detector
    static_configs:
      - targets: ['fraud_detector:8000']
        labels:
          service: scoring
  - job_name: scoring_writer
    static_configs:
      - targets: ['scoring_writer:8001']
        labels:
          service: persistence
  - job_name: node
    scrape_interval: 5s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: infrastructure
