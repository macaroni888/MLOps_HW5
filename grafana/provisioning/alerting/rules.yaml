apiVersion: 1
groups:
- orgId: 1
  name: fraud-service-health
  folder: Fraud Monitoring
  interval: 10s
  rules:
  - uid: fraud-stream-stalled
    title: 'Fraud: поток остановился'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus-metrics
      model:
        refId: A
        datasource: &id001
          type: prometheus
          uid: prometheus-metrics
        editorMode: code
        expr: time() - transaction_last_success_timestamp_seconds
        legendFormat: ''
        range: false
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 120
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: NoData
    execErrState: Error
    for: 1m
    annotations:
      summary: Нет подтверждённой отправки в kafka более 120 секунд.
      __dashboardUid__: fraud-detection
      __panelId__: '1'
    labels:
      severity: warning
      service: fraud_detector
    isPaused: false
  - uid: fraud-latency-high
    title: 'Fraud: высокая задержка'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus-metrics
      model:
        refId: A
        datasource: *id001
        editorMode: code
        expr: histogram_quantile(0.95, sum by (le) (rate(transaction_processing_duration_seconds_bucket[2m])))
        legendFormat: ''
        range: false
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0.5
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
    noDataState: NoData
    execErrState: Error
    for: 2m
    annotations:
      summary: 95-ый перцентиль обработки выше 0,5 секунды в течение двух минут.
      __dashboardUid__: fraud-detection
      __panelId__: '6'
    labels:
      severity: warning
      service: fraud_detector
    isPaused: false
