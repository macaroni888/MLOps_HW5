apiVersion: 1

datasources:
  - name: PostgreSQL Scores
    uid: postgres-scores
    type: postgres
    access: proxy
    url: $POSTGRES_HOST:$POSTGRES_PORT
    user: $GRAFANA_POSTGRES_USER
    isDefault: false
    editable: false
    version: 3
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: $GRAFANA_POSTGRES_PASSWORD
